name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  API_IMAGE_NAME: ghcr.io/eduardoprso/nox
  WEB_IMAGE_NAME: ghcr.io/eduardoprso/nox-web

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm format:check
      - run: python -m pip install -e ".[test]"
        working-directory: apps/device-bridge
      - run: python -m pytest
        working-directory: apps/device-bridge

  image:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.API_IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.WEB_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - id: images
        run: |
          echo "api_image=${API_IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=${WEB_IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/nox_deploy
          chmod 600 ~/.ssh/nox_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Authenticate VPS with GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i ~/.ssh/nox_deploy "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
      - name: Deploy and verify health
        env:
          DEPLOY_API_IMAGE: ${{ needs.image.outputs.api_image }}
          DEPLOY_WEB_IMAGE: ${{ needs.image.outputs.web_image }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i ~/.ssh/nox_deploy "$VPS_USER@$VPS_HOST" \
            "cd /opt/nox && git fetch origin main && git checkout --detach '$GITHUB_SHA' && NOX_IMAGE='$DEPLOY_API_IMAGE' NOX_WEB_IMAGE='$DEPLOY_WEB_IMAGE' EXPECTED_VERSION='$GITHUB_SHA' HEALTH_URL='https://dudunox.duckdns.org/health' WEB_HEALTH_URL='https://dudunox.duckdns.org/web-health' bash scripts/deploy.sh"
