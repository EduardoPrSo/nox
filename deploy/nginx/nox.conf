server {
    server_name dudunox.duckdns.org;

    client_max_body_size 25m;

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location = /voice {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /eko {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /bridge/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dudunox.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dudunox.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name dudunox.duckdns.org;
    return 301 https://$host$request_uri;
}
